# The checks every change to main passes. Nothing here needs a secret or
# writes to the repository: the token is read-only, checkout keeps no
# credentials, no step interpolates event data into a script, and every
# action is pinned to a commit (its release in the comment, which
# Dependabot keeps current).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  go:
    name: Go vet, gofmt and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # TestPageModules runs the page's modules in node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          package-manager-cache: false
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy -diff && go mod verify
          go -C tools mod tidy -diff && go -C tools mod verify
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'gofmt -w these:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      # The X tests run wherever Xvfb is, and expect the rest of make
      # test-x's container with it: a window manager, xterm, xrandr,
      # pulseaudio and agents built with openh264. The runner image has only
      # Xvfb, so it goes and those tests skip, as they do without make test-x.
      - name: leave the X tests to make test-x
        run: sudo apt-get remove -y xvfb
      # Without the openh264 and opus tags the encoder packages build as
      # stubs, so this needs no C toolchain.
      - name: go test
        run: go test ./...

  agents:
    name: Agents built, scanned and deployed
    runs-on: ubuntu-24.04
    # A cold cache compiles zig's musl and libc++, nasm, openh264 and opus
    # for both targets.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-go keys its cache by these files alone, so toolchain/lib.sh
      # gives the cgo cross builds a key of their own, apart from the go
      # job's test builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            toolchain/lib.sh
      # zig, the downloads and the libraries built from them. Every library
      # directory is already named by the hash of its inputs; the key names
      # the scripts that pin those inputs, and has no fallback, so a change
      # to a pin starts from an empty cache instead of carrying the old zig
      # and libraries along forever.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/toolchain
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain/*.sh') }}
      - name: make agents
        run: make agents
      # Scans both agents for anything of the runner and deploys the amd64
      # one over a local sshd; neither test skips here for want of an agent.
      - name: make test-agents
        run: make test-agents

  probe:
    name: Probe in distribution images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Go cache: the job builds one package, and a job that runs
      # third-party images saves nothing another job restores.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The Docker Official Images the X and Wayland suites also build
      # from. The probe runs in them with --network=none, as root inside a
      # rootless container, and nothing in this job holds a secret.
      - name: pull the probe's images
        run: |
          for image in docker.io/library/ubuntu:24.04 docker.io/library/alpine:3.20 docker.io/library/fedora:40; do
            podman pull -q "$image"
          done
      # Fails, rather than skips, a case whose image the step above missed.
      - name: go test the probe in podman
        run: ROBIN_REQUIRE_CONTAINERS=1 go test -run '^TestScriptContainers$' ./internal/probe

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The tools module pins govulncheck in its go.mod and go.sum, where
      # Dependabot keeps it current. Built once for this runner rather than
      # run with go tool, which would build it for the GOOS being checked.
      - name: govulncheck
        run: |
          govulncheck=$RUNNER_TEMP/govulncheck
          go -C tools build -o "$govulncheck" golang.org/x/vuln/cmd/govulncheck
          "$govulncheck" ./...
          for goos in darwin windows; do
            GOOS=$goos "$govulncheck" ./cmd/robin
          done

  page:
    name: Page unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          package-manager-cache: false
      - name: node --test
        run: node --test internal/web/static/test/*.test.js
      # npm ci fails when a lockfile and its package.json disagree. No
      # install script runs and no browser is downloaded.
      - name: e2e and browser smoke lockfiles
        run: |
          (cd e2e && npm ci --ignore-scripts --no-audit --no-fund)
          (cd internal/web/testdata/browser && npm ci --ignore-scripts --no-audit --no-fund)

  site:
    name: Docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      # No dependency needs an install script to test or build the site, and
      # without them a package cannot run code while npm installs it.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
