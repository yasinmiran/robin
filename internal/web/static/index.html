<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<video id="screen" autoplay muted playsinline></video>
<textarea id="typing" aria-label="Keyboard input for the remote desktop" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
<div id="preedit" role="status" aria-live="polite" hidden></div>
<div id="wire" aria-hidden="true"></div>
<div id="scrim" hidden></div>

<header id="hud" data-state="connecting">
  <div class="row">
    <span class="state" role="status"><i class="dot"></i><span id="state-label">Connecting</span></span>
    <span class="stat" id="transport" hidden>
      <svg class="glyph direct" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/><circle cx="2.5" cy="8" r="1.5"/><circle cx="13.5" cy="8" r="1.5"/></svg>
      <svg class="glyph tunnel" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8h14"/><rect x="4" y="4.5" width="8" height="7" rx="3.5"/></svg>
      <span class="label"></span>
    </span>
    <span class="stat" id="guests" role="status" hidden>
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="2.5"/><path d="M3 14c.6-2.9 2.6-4.5 5-4.5s4.4 1.6 5 4.5"/></svg>
      <span class="label"></span>
    </span>
    <span class="picture" hidden>
      <span class="stat" id="resolution"></span>
      <span class="stat" id="fps"></span>
      <span class="stat" id="bitrate"></span>
    </span>
    <span class="monitors" hidden>
      <button id="monitor" type="button" data-keys="local" aria-haspopup="menu" aria-expanded="false" aria-controls="monitor-menu" title="Choose the monitor to show">
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
        <span class="label"></span>
        <svg class="caret" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg>
      </button>
      <span id="monitor-menu" class="menu" role="menu" aria-label="Monitors" hidden></span>
    </span>
    <span class="controls">
      <button id="sound" type="button" aria-label="Sound" aria-pressed="false" title="Turn sound on" hidden>
        <svg class="off" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h2.5L8 3v10l-3.5-3H2z"/><path d="M10.5 5.75l4.5 4.5M15 5.75l-4.5 4.5"/></svg>
        <svg class="on" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h2.5L8 3v10l-3.5-3H2z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M13 3.5a6.5 6.5 0 0 1 0 9"/></svg>
      </button>
      <button id="keyboard" type="button" aria-label="Keyboard" aria-pressed="false" title="Show the keyboard" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8.5" rx="1.5"/><path d="M4 6.75h.01M6.67 6.75h.01M9.33 6.75h.01M12 6.75h.01M4 9.5h.01M12 9.5h.01M6 9.75h4"/></svg>
      </button>
      <button id="keys" type="button" data-keys="local" aria-label="Keys and macros" aria-expanded="false" aria-controls="keys-section" title="Keys and macros: send what the browser keeps for itself">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M6.5 5.75v4.5L10 8z"/></svg>
      </button>
      <button id="fullscreen" type="button" aria-label="Enter full screen" title="Full screen">
        <svg class="enter" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
        <svg class="exit" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg>
      </button>
    </span>
  </div>
  <p class="notice" hidden></p>
</header>
</body>
</html>
