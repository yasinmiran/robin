<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remotejump</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<video id="screen" autoplay muted playsinline></video>
<div id="wire" aria-hidden="true"></div>
<div id="scrim" hidden></div>

<header id="hud" data-state="connecting">
  <div class="row">
    <span class="state" role="status"><i class="dot"></i><span id="state-label">Connecting</span></span>
    <span class="stat" id="transport" hidden>
      <svg class="glyph direct" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/><circle cx="2.5" cy="8" r="1.5"/><circle cx="13.5" cy="8" r="1.5"/></svg>
      <svg class="glyph tunnel" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8h14"/><rect x="4" y="4.5" width="8" height="7" rx="3.5"/></svg>
      <span class="label"></span>
    </span>
    <span class="picture" hidden>
      <span class="stat" id="resolution"></span>
      <span class="stat" id="fps"></span>
      <span class="stat" id="bitrate"></span>
    </span>
    <button id="fullscreen" type="button" aria-label="Enter full screen" title="Full screen">
      <svg class="enter" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
      <svg class="exit" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg>
    </button>
  </div>
  <p class="notice" hidden></p>
</header>
</body>
</html>
